[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notmemory"
version = "0.1.0"
description = "Deterministic memory observability for long-lived AI agents."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20",
    "cryptography>=42",
    "anyio>=4",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.2",
    "langgraph>=0.2",
]
mcp = [
    "mcp>=1.0",
]
mem0      = [
    "mem0ai>=0.1.0",
]
postgres = [
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
]
openai = [
    "openai>=1.30",
]
dashboard = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["notmemory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true